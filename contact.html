        <a href="/"><img src="assets/logo-yellow-2.png" alt="พรรคก้าวใหม่" class="logo"></a>
        <nav>
            <a href="/">หน้าแรก</a>

        </nav>
        <div class="menu-btn bi bi-list" onclick="toggleMenu()"></div>
        <div class="offcanvas" id="offcanvas">
            <div class="close-btn bi bi-x" onclick="toggleMenu()"></div>

            <a href="/">หน้าแรก</a>
            <a href="/policy.html">นโยบาย</a>
            <a href="/mp.html">ส.ส. พรรค</a>
            <a href="/about.html">เกี่ยวกับพรรค</a>
            <a href="/contact.html" class="active">ติดต่อเรา</a>
        </div>
    </header>

    <main>
        
        <section class="contact">

            <div class="heading">ติดต่อพรรค</div>

            <form class="contact-form" action="https://formspree.io/f/mwvnynrr" method="POST">

                <div class="form-group hidden">
                    <label>ชื่อ - นามสกุล</label>
                    <input type="text" name="name" placeholder="กรอกชื่อของคุณ" required>
                </div>

                <div class="form-group hidden">
                    <label>อีเมล</label>
                    <input type="email" name="email" placeholder="example@email.com" required>
                </div>

                <div class="form-group hidden">
                    <label>หัวข้อ</label>
                    <input type="text" name="subject" placeholder="เรื่องที่ต้องการติดต่อ">
                </div>

                <div class="form-group hidden">
                    <label>ข้อความ</label>
                    <textarea name="message" rows="6" placeholder="พิมพ์ข้อความของคุณ..." required></textarea>
                </div>

                <button type="submit" class="btn-submit hidden">ส่งข้อความ</button>

            </form>
        </section>

    </main>

    <footer>
        &copy <script type="text/javascript">document.write(new Date().getFullYear());</script> พรรคก้าวใหม่ - สงวนลิขสิทธิ์ทุกประการ
    </footer>
